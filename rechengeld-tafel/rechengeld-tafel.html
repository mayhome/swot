/* Layout: Kopf mit Stufen-Reitern · links Aufgabenkarte · rechts großes Legefeld · unten Leiste mit Geldstapeln zum Ziehen */
:root{
  --bg:#eef3f1; --panel:#ffffff; --field:#f7faf8; --line:#cfdcd6; --ink:#1d2b27; --muted:#5b6d66;
  --accent:#0f6f5c; --accent-ink:#ffffff; --accent-soft:#d6ece5;
  --ok:#1f8a4c; --ok-soft:#dcf3e4; --warn:#b8610b; --warn-soft:#fdecd6; --bad:#b3261e; --bad-soft:#fbe0dd;
  --note-ink:#1f2a33;
  --font:"Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a18; --panel:#1b2522; --field:#16201d; --line:#2f3f3a; --ink:#e6efeb; --muted:#9db0a8;
  --accent:#4fc2a6; --accent-ink:#06231c; --accent-soft:#1f3a33;
  --ok:#5fd18f; --ok-soft:#173225; --warn:#f0a55a; --warn-soft:#3a2a17; --bad:#ff8a80; --bad-soft:#3d1d1a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121a18; --panel:#1b2522; --field:#16201d; --line:#2f3f3a; --ink:#e6efeb; --muted:#9db0a8;
  --accent:#4fc2a6; --accent-ink:#06231c; --accent-soft:#1f3a33;
  --ok:#5fd18f; --ok-soft:#173225; --warn:#f0a55a; --warn-soft:#3a2a17; --bad:#ff8a80; --bad-soft:#3d1d1a;
  color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;gap:12px;max-width:1600px;margin:0 auto}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:.4em}
h1 .euro{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.8em}
.tabs{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.tab{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:.55em 1.05em;font-size:1rem;font-weight:600}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab small{font-weight:500;opacity:.8}
.iconbtn{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:.5em .8em;font-weight:600;font-size:.95rem}

.main{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:12px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}

.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px;min-width:0}
.level{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.task{font-size:clamp(1.4rem,2.2vw,2rem);font-weight:700;line-height:1.25;text-wrap:balance;margin:0}
.task em{font-style:normal;background:var(--accent-soft);padding:0 .25em;border-radius:6px}
.hint{color:var(--muted);margin:0;line-height:1.45}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;width:100%}
.amount{font:inherit;font-size:1.3rem;font-weight:700;width:8.5em;padding:.35em .6em;border:2px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font-variant-numeric:tabular-nums}
.chip{border:2px solid var(--line);background:var(--field);border-radius:10px;padding:.45em .8em;font-weight:600;font-size:1rem;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:2px solid var(--line);background:var(--field);border-radius:14px;padding:.75em .8em;font-size:1.05rem;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);grid-column:1/-1;font-size:1.3rem}
.btn:active,.chip:active,.tab:active{transform:translateY(1px)}

.feedback{border-radius:14px;padding:.8em 1em;font-size:1.2rem;font-weight:700;line-height:1.35}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.warn{background:var(--warn-soft);color:var(--warn)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}

.found{display:grid;gap:8px}
.found h3{margin:0;font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline}
.found h3 b{font-size:1.6rem;color:var(--accent);font-variant-numeric:tabular-nums}
.sol{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto}
.solchip{border:2px solid var(--line);background:var(--field);border-radius:10px;padding:.35em .6em;font-size:.95rem;font-weight:600;font-variant-numeric:tabular-nums;text-align:left}
.solchip.got{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.solchip.miss{border-style:dashed;color:var(--muted)}

/* Legefeld */
.board{background:var(--panel);border:2px solid var(--line);border-radius:18px;display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:420px}
.status{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 16px;border-bottom:2px solid var(--line)}
.sum{font-size:clamp(1.8rem,3.4vw,2.8rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;min-width:5ch}
.sum.hidden{color:var(--muted)}
.counts{display:flex;gap:16px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.counts b{color:var(--ink);font-size:1.3rem}
.status .spacer{flex:1}
.fmt{display:flex;gap:6px;margin-top:6px}
.fmt .chip{font-size:.85rem;padding:.3em .65em}
.field{background:var(--field);border-radius:0 0 16px 16px;padding:16px;display:grid;gap:14px;align-content:start;min-height:320px;
  background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:22px 22px}
.zone{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:30px}
.empty{color:var(--muted);font-size:1.2rem;text-align:center;padding:60px 10px;line-height:1.5}

/* Kasse: Leiste mit Stapeln unten */
.till{position:sticky;bottom:0;z-index:5;background:var(--panel);border:2px solid var(--line);border-radius:18px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-end;justify-content:center;
  box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.till .zone{gap:10px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.stack{position:relative;background:none;border:none;padding:6px 10px 4px 4px;border-radius:12px;touch-action:none;display:grid;justify-items:center;gap:4px;user-select:none;-webkit-user-select:none}
.stack .pile{position:relative;display:grid}
.stack .pile>*{grid-area:1/1}
.stack .pile>*:nth-child(1){transform:translate(6px,-6px)}
.stack .pile>*:nth-child(2){transform:translate(3px,-3px)}
.stack .cap{font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.stack:disabled{opacity:.2;cursor:not-allowed;filter:grayscale(1)}
.stack:not(:disabled){cursor:grab}
.stack:not(:disabled):hover{background:var(--accent-soft)}

/* Geld (Bilder) */
.money{--mm:.82px;display:block;pointer-events:none;-webkit-user-drag:none}
.field .money{--mm:1.45px}
.field.many .money{--mm:1.1px}
.note{width:calc(var(--w)*var(--mm));height:calc(var(--h)*var(--mm));border-radius:calc(3*var(--mm));object-fit:fill;
  box-shadow:0 1px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.14)}
.coin{width:calc(var(--d)*var(--mm)*2.2);height:calc(var(--d)*var(--mm)*2.2);border-radius:50%;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.n5{--w:120;--h:62}.n10{--w:127;--h:67}.n20{--w:133;--h:72}.n50{--w:140;--h:77}.n100{--w:147;--h:77}.n200{--w:153;--h:77}
.c1{--d:16.25}.c2{--d:18.75}.c5{--d:21.25}.c10{--d:19.75}.c20{--d:22.25}.c50{--d:24.25}.c100{--d:23.25}.c200{--d:25.75}

.field .piece{background:none;border:none;padding:0;border-radius:10px;touch-action:none;cursor:grab}
.field .piece.new{animation:pop .22s ease-out}
.field .piece:hover{outline:3px dashed var(--bad);outline-offset:3px}
.field.drop{outline:4px dashed var(--accent);outline-offset:-8px;background-color:var(--accent-soft)}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(1.05);filter:drop-shadow(0 10px 14px rgba(0,0,0,.3))}
.ghost .money{--mm:1.45px}
.ghost.out{opacity:.55}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.field .piece{animation:none}}
.foot{color:var(--muted);font-size:.85rem;text-align:center;margin:0}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="euro">€</span>Rechengeld-Tafel</h1>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-mode="s1">Stufe 1 <small>Anzahl Scheine</small></button>
      <button class="tab" role="tab" data-mode="s2">Stufe 2 <small>Möglichst wenig</small></button>
      <button class="tab" role="tab" data-mode="s3">Stufe 3 <small>Wie viele Möglichkeiten?</small></button>
    </nav>
    <button class="iconbtn" id="fs" type="button">⛶ Vollbild</button>
  </header>

  <div class="main">
    <section class="card" id="taskcard" aria-live="polite"></section>

    <section class="board">
      <div class="status">
        <div>
          <div class="lbl">Gelegt</div>
          <div class="sum" id="sum">0 €</div>
          <div class="fmt" id="fmt" role="group" aria-label="Darstellung der Summe">
            <button class="chip" type="button" data-fmt="eur">0,00 €</button>
            <button class="chip" type="button" data-fmt="euct">€ und ct</button>
            <button class="chip" type="button" data-fmt="ct">nur ct</button>
          </div>
        </div>
        <div class="counts">
          <div>Scheine <b id="cntN">0</b></div>
          <div>Münzen <b id="cntC">0</b></div>
          <div>Teile <b id="cntT">0</b></div>
        </div>
        <div class="spacer"></div>
        <button class="iconbtn" id="eye" type="button">Summe verbergen</button>
        <button class="iconbtn" id="undo" type="button">↶ Zurück</button>
        <button class="iconbtn" id="clear" type="button">Leeren</button>
      </div>
      <div class="field" id="field"></div>

const DEN=[
  {v:20000,t:'n',k:'n200',l:'200'},{v:10000,t:'n',k:'n100',l:'100'},{v:5000,t:'n',k:'n50',l:'50'},
  {v:2000,t:'n',k:'n20',l:'20'},{v:1000,t:'n',k:'n10',l:'10'},{v:500,t:'n',k:'n5',l:'5'},
  {v:200,t:'c',k:'c200 e2',l:'2',u:'EURO'},{v:100,t:'c',k:'c100 e1',l:'1',u:'EURO'},
  {v:50,t:'c',k:'c50 au',l:'50',u:'CENT'},{v:20,t:'c',k:'c20 au',l:'20',u:'CENT'},{v:10,t:'c',k:'c10 au',l:'10',u:'CENT'},
  {v:5,t:'c',k:'c5 cu',l:'5',u:'CENT'},{v:2,t:'c',k:'c2 cu',l:'2',u:'CENT'},{v:1,t:'c',k:'c1 cu',l:'1',u:'CENT'}];
const byV=Object.fromEntries(DEN.map(d=>[d.v,d]));
const NOTES=DEN.filter(d=>d.t==='n').map(d=>d.v);

const S={mode:'s1',field:[],hist:[],showSum:true,
  fmt:'eur',target:{s1:30000,s2:33300,s3:40000},n:2,s2cents:false,
  allowed3:new Set([5000,10000,20000]),found:[],reveal:false,fb:null};

/* ---------- Hilfen ---------- */
const eur=c=>{const e=Math.floor(c/100),ct=c%100;return (ct? e.toLocaleString('de-DE')+','+String(ct).padStart(2,'0'):e.toLocaleString('de-DE'))+' €'};
const dname=v=>v>=100?eur(v):v+' ct';
const parse=s=>{s=String(s).trim().replace(/€|\s/g,'').replace(/\./g,'').replace(',','.');if(!s)return 0;const x=Math.round(parseFloat(s)*100);return isFinite(x)&&x>0?x:NaN};
const keyOf=arr=>[...arr].sort((a,b)=>b-a).join('+');
const fmtCombo=arr=>{const m=new Map();[...arr].sort((a,b)=>b-a).forEach(v=>m.set(v,(m.get(v)||0)+1));
  return [...m].map(([v,n])=>(n>1?n+' × ':'')+dname(v)).join(' + ')};
const sum=a=>a.reduce((s,x)=>s+x,0);
const nNotes=a=>a.filter(v=>v>=500).length;
function noteSvg(d){
  const cls=d.t==='n'?'note n'+(d.v/100):'coin c'+d.v;
  return `<img class="money ${cls}" src="${IMG[d.v]}" alt="${dname(d.v)}" draggable="false">`;
}
/* alle Möglichkeiten (Multimengen) aufzählen */
function enumerate(target,dens,exact,limit=5000){
  dens=[...dens].sort((a,b)=>b-a);const out=[];const cur=[];
  (function rec(i,rem,cnt){
    if(out.length>=limit)return;
    if(rem===0){if(exact==null||cnt===exact)out.push([...cur]);return}
    if(i>=dens.length)return;
    if(exact!=null){const left=exact-cnt;if(left<=0)return;if(rem>left*dens[i])return;if(rem<left*dens[dens.length-1])return}
    const d=dens[i];const max=Math.floor(rem/d);
    for(let k=max;k>=0;k--){for(let j=0;j<k;j++)cur.push(d);rec(i+1,rem-k*d,cnt+k);for(let j=0;j<k;j++)cur.pop()}
  })(0,target,0);
  return out;
}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function countWays(target,dens){
  if(!dens.length)return 0n;const g=dens.reduce(gcd);if(target%g)return 0n;
  const T=target/g;if(T>200000)return null;const w=new Array(T+1).fill(0n);w[0]=1n;
  for(const d0 of dens){const d=d0/g;for(let s=d;s<=T;s++)w[s]+=w[s-d]}
  return w[T];
}
function greedy(t){const r=[];for(const d of DEN){while(t>=d.v){r.push(d.v);t-=d.v}}return r}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- erlaubte Geldstücke je Modus ---------- */
function allowed(){
  if(S.mode==='s1')return new Set(NOTES);
  if(S.mode==='s3')return S.allowed3;
  return new Set(DEN.map(d=>d.v));
}

/* ---------- Aktionen ---------- */
function push(){S.hist.push([...S.field]);if(S.hist.length>200)S.hist.shift()}
function add(v){push();S.field.push(v);S.justAdded=S.field.length-1;S.fb=null;renderBoard();renderTask()}
function removeAt(i){push();S.field.splice(i,1);S.fb=null;renderBoard();renderTask()}
function setMode(m){S.mode=m;try{history.replaceState(null,'','#'+m)}catch(_){location.hash=m}S.field=[];S.hist=[];S.found=[];S.reveal=false;S.fb=null;render()}
function resetTask(){S.field=[];S.hist=[];S.found=[];S.reveal=false;S.fb=null;render()}

function check(){
  const t=S.target[S.mode],s=sum(S.field),a=allowed();
  if(!S.field.length){S.fb={c:'warn',m:'Lege zuerst Geld ins Legefeld.'};return renderTask()}
  if(S.field.some(v=>!a.has(v))){S.fb={c:'bad',m:'Du hast Geld benutzt, das bei dieser Aufgabe nicht erlaubt ist.'};return renderTask()}
  if(s<t){S.fb={c:'warn',m:`Es fehlen noch ${eur(t-s)}.`};return renderTask()}
  if(s>t){S.fb={c:'bad',m:`Das sind ${eur(s-t)} zu viel.`};return renderTask()}
  if(S.mode==='s1'){
    const n=S.field.length;
    if(n!==S.n){S.fb={c:'warn',m:`Der Betrag stimmt! Aber du hast ${n} Scheine gelegt, nicht ${S.n}.`};return renderTask()}
    return saveFound('Richtig! Das ist eine Möglichkeit.');
  }
  if(S.mode==='s2'){
    const min=greedy(t).length,n=S.field.length;
    S.fb=n===min?{c:'ok',m:`Super! ${n} ${n===1?'Teil':'Teile'} – weniger geht nicht.`}
      :{c:'warn',m:`Der Betrag stimmt! Du hast ${n} Teile. Es geht aber mit weniger.`};
    return renderTask();
  }
  if(S.mode==='s3')return saveFound('Richtig! Das ist eine Möglichkeit.');
}
function saveFound(msg){
  const k=keyOf(S.field);
  if(S.found.includes(k)){S.fb={c:'warn',m:'Diese Möglichkeit hast du schon gefunden. Findest du eine andere?'};return renderTask()}
  S.found.push(k);S.fb={c:'ok',m:msg+' Leg die nächste!'};renderTask();
  setTimeout(()=>{if(keyOf(S.field)===k){S.field=[];S.hist=[];renderBoard()}},1400);
}
function newTask(){
  S.reveal=false;S.found=[];S.fb=null;S.field=[];S.hist=[];
  if(S.mode==='s1'){
    for(let i=0;i<200;i++){const n=rnd(2,5),t=rnd(2,16)*5000;
      if(enumerate(t,NOTES,n,1).length){S.n=n;S.target.s1=t;break}}
  }else if(S.mode==='s2'){
    S.target.s2=S.s2cents?rnd(1000,99999):rnd(11,999)*100;
  }else if(S.mode==='s3'){
    const sets=[[5000,10000,20000],[2000,5000,10000],[1000,2000,5000],[5000,10000],[10000,20000],[500,1000,2000]];
    const set=pick(sets);S.allowed3=new Set(set);
    const g=Math.max(...set);S.target.s3=pick([2,3,4,5,6,7].map(x=>x*Math.max(10000,g)));
    if(Math.max(...set)<=2000)S.target.s3=pick([2000,3000,4000,5000,6000]);
    else if(Math.max(...set)<=5000)S.target.s3=pick([10000,15000,20000]);
  }
  render();
}
function lay(arr){push();S.field=[...arr];S.fb=null;renderBoard();renderTask()}

/* ---------- Rendering ---------- */
function renderTill(){
  const a=allowed();
  const mk=d=>{const one=noteSvg(d);return `<button class="stack" type="button" data-v="${d.v}" ${a.has(d.v)?'':'disabled'} aria-label="${dname(d.v)} hinlegen"><span class="pile">${one}${one}${one}</span><span class="cap">${dname(d.v)}</span></button>`};
  tillNotes.innerHTML=DEN.filter(d=>d.t==='n').reverse().map(mk).join('');
  tillCoins.innerHTML=DEN.filter(d=>d.t==='c').reverse().map(mk).join('');
}
function renderBoard(){
  const f=S.field,s=sum(f);
  sum_.textContent=S.showSum?fmtSum(s):'?';fmt.querySelectorAll('[data-fmt]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.fmt===S.fmt));sum_.classList.toggle('hidden',!S.showSum);
  eye.textContent=S.showSum?'Summe verbergen':'Summe zeigen';
  cntN.textContent=nNotes(f);cntC.textContent=f.length-nNotes(f);cntT.textContent=f.length;
  field.classList.toggle('many',f.length>10);const ja=S.justAdded;S.justAdded=-1;
  if(!f.length){field.innerHTML='<div class="empty">Das Legefeld ist leer.<br>Zieh Scheine und Münzen von den Stapeln unten hierher.</div>';return}
  const idx=f.map((v,i)=>[v,i]);
  const mk=([v,i])=>`<button class="piece${i===ja?' new':''}" type="button" data-i="${i}" aria-label="${dname(v)} wegnehmen">${noteSvg(byV[v])}</button>`;
  const ns=idx.filter(([v])=>v>=500),cs=idx.filter(([v])=>v<500);
  field.innerHTML=(ns.length?`<div class="zone">${ns.map(mk).join('')}</div>`:'')+(cs.length?`<div class="zone">${cs.map(mk).join('')}</div>`:'');
}
const sum_=document.getElementById('sum');
function fmtSum(c){
  const e=Math.floor(c/100),ct=c%100;
  if(S.fmt==='ct')return c.toLocaleString('de-DE')+' ct';
  if(S.fmt==='euct')return e.toLocaleString('de-DE')+' € '+ct+' ct';
  return e.toLocaleString('de-DE')+','+String(ct).padStart(2,'0')+' €';
}
fmt.onclick=e=>{const b=e.target.closest('[data-fmt]');if(b){S.fmt=b.dataset.fmt;try{localStorage.setItem('fmt',S.fmt)}catch(_){};renderBoard()}};
try{const f=localStorage.getItem('fmt');if(f)S.fmt=f}catch(_){}

function amountInput(){
  const t=S.target[S.mode];
  return `<div class="row"><label class="lbl" for="amt">Betrag</label>
    <input class="amount" id="amt" inputmode="decimal" value="${t?eur(t).replace(' €',''):''}" placeholder="z. B. 700"> <b>€</b></div>`;
}
function presetChips(list){
  return `<div class="row">${list.map(c=>`<button class="chip" type="button" data-amt="${c}" aria-pressed="${S.target[S.mode]===c}">${eur(c)}</button>`).join('')}</div>`;
}
function fbHtml(){return S.fb?`<div class="feedback ${S.fb.c}">${S.fb.m}</div>`:''}

function foundHtml(all){
  const got=new Set(S.found);
  let h=`<div class="found"><h3>Gefundene Möglichkeiten <b>${S.found.length}</b></h3>`;
  if(S.found.length)h+=`<div class="sol">${S.found.map(k=>`<button class="solchip got" type="button" data-lay="${k}">${fmtCombo(k.split('+').map(Number))}</button>`).join('')}</div>`;
  if(S.reveal&&all){
    const total=all.total;
    h+=`<div class="feedback ok">Es gibt ${total===null?'sehr, sehr viele':(typeof total==='bigint'?total.toLocaleString('de-DE'):total)} ${total===1||total===1n?'Möglichkeit':'Möglichkeiten'}.</div>`;
    if(all.list){const miss=all.list.filter(a=>!got.has(keyOf(a)));
      if(miss.length)h+=`<div class="lbl">Noch nicht gefunden</div><div class="sol">${miss.map(a=>`<button class="solchip miss" type="button" data-lay="${keyOf(a)}">${fmtCombo(a)}</button>`).join('')}</div>`;}
    else h+=`<p class="hint">Zu viele, um alle aufzulisten.</p>`;
  }
  return h+'</div>';
}

function renderTask(){
  const m=S.mode,t=S.target[m];let h='';
  if(m==='s1'){
    const all=enumerate(t,NOTES,S.n);
    h=`<div class="level">Stufe 1 · nur Scheine</div>
      <p class="task">Lege <em>${eur(t)}</em> mit genau <em>${S.n} Scheinen</em>.</p>
      <p class="hint">Wie viele Möglichkeiten findest du? Jede richtige Lösung wird gesammelt.</p>
      ${amountInput()}${presetChips([30000,40000,50000,70000])}
      <div class="row"><span class="lbl">Anzahl Scheine</span>${[2,3,4,5,6].map(n=>`<button class="chip" type="button" data-n="${n}" aria-pressed="${S.n===n}">${n}</button>`).join('')}</div>
      <div class="btns"><button class="btn primary" id="chk" type="button">Prüfen</button>
      <button class="btn" id="new" type="button">Neue Aufgabe</button><button class="btn" id="rev" type="button">${S.reveal?'Lösungen verbergen':'Alle Lösungen'}</button></div>
      ${fbHtml()}${foundHtml(S.reveal?{total:all.length,list:all}:null)}`;
  }else if(m==='s2'){
    h=`<div class="level">Stufe 2 · Scheine und Münzen</div>
      <p class="task">Lege <em>${eur(t)}</em> mit möglichst wenig Scheinen und Münzen.</p>
      <p class="hint">Je größer die Scheine, desto weniger Teile brauchst du.</p>
      ${amountInput()}${presetChips([33300,18700,4785,99999])}
      <div class="row"><button class="chip" type="button" id="cents" aria-pressed="${S.s2cents}">Neue Aufgaben mit Cent</button></div>
      <div class="btns"><button class="btn primary" id="chk" type="button">Prüfen</button>
      <button class="btn" id="new" type="button">Neue Aufgabe</button><button class="btn" id="sol2" type="button">Lösung zeigen</button></div>
      ${fbHtml()}${S.reveal?`<div class="feedback ok">Am wenigsten: ${greedy(t).length} Teile<br><span style="font-weight:600">${fmtCombo(greedy(t))}</span></div>`:''}`;
  }else{
    const dens=[...S.allowed3];
    let all=null;
    if(S.reveal){const total=countWays(t,dens);const list=(total!==null&&total<=80n)?enumerate(t,dens,null):null;all={total,list}}
    h=`<div class="level">Stufe 3 · Möglichkeiten finden</div>
      <p class="task">Lege <em>${eur(t)}</em>. Wie viele Möglichkeiten findest du?</p>
      <p class="hint">Erlaubt sind nur die markierten Scheine und Münzen. Jede neue Lösung wird gezählt.</p>
      ${amountInput()}${presetChips([10000,30000,40000,70000])}
      <div class="row"><span class="lbl">Erlaubtes Geld</span>${DEN.map(d=>`<button class="chip" type="button" data-den="${d.v}" aria-pressed="${S.allowed3.has(d.v)}">${dname(d.v)}</button>`).join('')}</div>
      <div class="btns"><button class="btn primary" id="chk" type="button">Prüfen</button>
      <button class="btn" id="new" type="button">Neue Aufgabe</button><button class="btn" id="rev" type="button">${S.reveal?'Lösungen verbergen':'Alle Lösungen'}</button></div>
      ${fbHtml()}${foundHtml(all)}`;
  }
  taskcard.innerHTML=h;
}
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===S.mode));
  renderTill();renderBoard();renderTask();
}

/* ---------- Ereignisse ---------- */
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)setMode(b.dataset.mode)};
/* Ziehen & Ablegen (Maus, Finger, Stift) – Antippen geht auch */
let drag=null;
function overField(x,y){const r=field.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
document.addEventListener('pointerdown',e=>{
  const src=e.target.closest('.stack:not(:disabled),.field .piece');if(!src||e.button>0)return;
  e.preventDefault();
  drag={src,fromTill:src.classList.contains('stack'),v:src.classList.contains('stack')?+src.dataset.v:S.field[+src.dataset.i],i:+src.dataset.i,x:e.clientX,y:e.clientY,moved:false,ghost:null,id:e.pointerId};
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
    drag.moved=true;const g=document.createElement('div');g.className='ghost';g.innerHTML=noteSvg(byV[drag.v]);document.body.appendChild(g);drag.ghost=g;
    if(!drag.fromTill)drag.src.style.opacity='.25';
  }
  if(drag.moved){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';
    const inF=overField(e.clientX,e.clientY);field.classList.toggle('drop',drag.fromTill&&inF);drag.ghost.classList.toggle('out',!drag.fromTill&&!inF)}
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;
  field.classList.remove('drop');if(d.ghost)d.ghost.remove();if(!d.fromTill)d.src.style.opacity='';
  if(cancel)return;
  if(!d.moved){d.fromTill?add(d.v):removeAt(d.i);return}
  const inF=overField(e.clientX,e.clientY);
  if(d.fromTill&&inF)add(d.v);
  else if(!d.fromTill&&!inF)removeAt(d.i);
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const b=e.target.closest&&e.target.closest('.stack:not(:disabled),.field .piece');if(!b)return;e.preventDefault();b.classList.contains('stack')?add(+b.dataset.v):removeAt(+b.dataset.i)});
eye.onclick=()=>{S.showSum=!S.showSum;renderBoard()};
undo.onclick=()=>{if(S.hist.length){S.field=S.hist.pop();S.fb=null;renderBoard();renderTask()}};
clear.onclick=()=>{if(S.field.length){push();S.field=[];S.fb=null;renderBoard();renderTask()}};
fs.onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();p&&p.catch&&p.catch(()=>{})}catch(_){}};

taskcard.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.amt){S.target[S.mode]=+b.dataset.amt;resetTask();return}
  if(b.dataset.n){S.n=+b.dataset.n;resetTask();return}
  if(b.dataset.den){const v=+b.dataset.den;S.allowed3.has(v)?S.allowed3.delete(v):S.allowed3.add(v);S.found=[];S.reveal=false;S.fb=null;render();return}
  if(b.dataset.lay){lay(b.dataset.lay.split('+').map(Number));return}
  if(b.id==='chk')check();
  if(b.id==='new')newTask();
  if(b.id==='rev'){S.reveal=!S.reveal;renderTask()}
  if(b.id==='sol2'){S.reveal=!S.reveal;renderTask()}
  if(b.id==='cents'){S.s2cents=!S.s2cents;renderTask()}
});
taskcard.addEventListener('change',e=>{
  if(e.target.id!=='amt')return;const v=parse(e.target.value);
  if(isNaN(v)||v>9999999){S.fb={c:'bad',m:'Bitte einen Betrag wie 700 oder 47,85 eingeben.'};return renderTask()}
  if(S.mode==='s1'&&v%500){S.fb={c:'bad',m:'Mit Scheinen gehen nur Beträge in 5-€-Schritten.'};return renderTask()}
  S.target[S.mode]=v;resetTask();
});
taskcard.addEventListener('keydown',e=>{if(e.target.id==='amt'&&e.key==='Enter')e.target.blur()});

/* Start: Stufe aus der Adresse (#s1, #s2, #s3), sonst Stufe 1 */
const MODES=['s1','s2','s3'];
function fromHash(){const m=location.hash.slice(1);return MODES.includes(m)?m:'s1'}
S.mode=fromHash();
addEventListener('hashchange',()=>{const m=fromHash();if(m!==S.mode)setMode(m)});
render();
</script>
